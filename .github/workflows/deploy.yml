name: Deploy website

on:
  push:
    branches: [main]
    paths: ["site/**"]
  workflow_dispatch:

permissions:
  id-token: write # lets the job request an OIDC token from GitHub
  contents: read

concurrency: deploy-production

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Sign in to AWS with OIDC (no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload HTML (always revalidated)
        run: >
          aws s3 sync site/ s3://${{ vars.S3_BUCKET }}/ --delete
          --exclude "*" --include "*.html"
          --cache-control "no-cache"

      - name: Upload images and icons (cached for a day)
        run: >
          aws s3 sync site/ s3://${{ vars.S3_BUCKET }}/ --delete
          --exclude "*.html"
          --cache-control "public, max-age=86400"

      - name: Refresh CloudFront
        run: >
          aws cloudfront create-invalidation
          --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
          --paths "/*"
